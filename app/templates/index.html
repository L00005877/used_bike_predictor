<title>Used Bike Price Predictor</title>
</head>
<body>
<h1>Used Bike Price Predictor</h1>
<form action="/predict" method="POST">
<label>Age (years):</label>
<input type="number" name="age_years" required><br><br>
<label>Kms ridden:</label>
<input type="number" name="kms_ridden" required><br><br>
<label>Condition (1-5):</label>
<input type="number" name="condition_score" min="1" max="5" required><br><br>
<button type="submit">Predict Price</button>
</form>
</body>
</html>
